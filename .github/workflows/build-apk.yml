name: "Build APK \U0001F4F1"

# يبني ملف APK حقيقي من التطبيق عند كل دفع، ويرفعه:
#  1) كـ Artifact للتحميل من صفحة الـ Actions
#  2) في GitHub Release بوسم apk-latest (رابط ثابت للتحميل)
#  3) داخل public/downloads ليُحمّل مباشرة من زر التحميل في الموقع

on:
  push:
    branches: [main, "arena/**"]
    paths-ignore:
      - "public/downloads/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true   # الخطوة التالية تثبّت SDK يدوياً لو فشل هذا الأكشن

      - name: Install Android API 35/36 packages
        run: |
          set -e
          # تنزيلات SDK تفشل أحياناً بشكل متقطع على شبكة GitHub Actions => إعادة محاولة
          retry() {
            n=1
            while [ "$n" -le 4 ]; do
              if "$@"; then return 0; fi
              echo "::warning::attempt $n failed, retrying in 20s: $*"
              n=$((n+1))
              sleep 20
            done
            echo "::error::all attempts failed: $*"
            return 1
          }

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
            mkdir -p "$SDK_ROOT"
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # أحياناً يُثبَّت الإكشن أدوات الأوامر تحت اسم إصدار بدل latest
          if [ ! -x "$SDKMANAGER" ]; then
            ALT="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
            if [ -n "$ALT" ]; then SDKMANAGER="$ALT"; fi
          fi
          # لو تعثّر action الـ SDK ولم تتواجد أدوات الأوامر => نزّلها يدوياً
          if [ ! -x "$SDKMANAGER" ] && ! command -v sdkmanager > /dev/null 2>&1; then
            echo "::warning::sdkmanager missing - installing Android cmdline-tools manually"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            retry curl -fsSL --retry 3 -o /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            rm -rf /tmp/cmdline-tools && unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "SDKMANAGER=$SDKMANAGER"

          retry bash -c "yes | '$SDKMANAGER' --licenses > /dev/null 2>&1" || true
          retry "$SDKMANAGER" "platform-tools" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0"

          # تأكّد أن المنصة المطلوبة موجودة فعلاً (وإلا فشل البناء برسالة واضحة)
          if [ ! -d "$SDK_ROOT/platforms/android-36" ]; then
            echo "::error::Android platform 36 missing under $SDK_ROOT/platforms"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          # دلّ Gradle على مكان الـ SDK
          echo "sdk.dir=$SDK_ROOT" > android/local.properties
          cat android/local.properties

      - name: Install dependencies
        run: npm ci

      - name: Generate shared alarm constants
        run: npm run generate:alarm

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test web engines
        run: npm test

      - name: Build production web
        run: npm run build

      - name: Export web and sync Capacitor
        run: npm run build:apk

      - name: Test native alarm engine
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Release variant (unsigned compile validation)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare release signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE GitHub Secret (base64 encoded release keystore)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/hatsally-release.jks"
          test -s "$RUNNER_TEMP/hatsally-release.jks"

      - name: Assemble signed Release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/hatsally-release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          for value in KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [ -z "${!value}" ]; then echo "::error::Missing GitHub Secret: $value"; exit 1; fi
          done
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and manifest
        id: apk
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0/apksigner"
          AAPT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING="$($AAPT dump badging "$APK" | head -1)"
          echo "$BADGING"
          VERSION_CODE="$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Collect verified Release APK and metadata
        env:
          APK_VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          APK_VERSION_NAME: ${{ steps.apk.outputs.version_name }}
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/release/app-release.apk public/downloads/hatsally.apk
          node scripts/apk-info.mjs
          cat public/downloads/apk-info.json

      - name: Upload signed Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hatsally-release-apk-${{ steps.apk.outputs.version_name }}
          path: public/downloads/hatsally.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "هتصلي APK ${{ steps.apk.outputs.version_name }} 📱"
          body: |
            Signed production Release APK.
            Version: ${{ steps.apk.outputs.version_name }}
            Version code: ${{ steps.apk.outputs.version_code }}
          files: public/downloads/hatsally.apk

      - name: Commit verified Release APK back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/hatsally.apk public/downloads/apk-info.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "📱 signed Release APK ${{ steps.apk.outputs.version_name }} [skip ci]"
          git push
