name: Build APK 📱

# يبني ملف APK ويدفعه إلى public/apk/ ليستضيفه الموقع مباشرة
on:
  push:
    branches: [main, "arena/**"]
    paths-ignore:
      - "public/apk/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Ensure signing keystore (persisted in repo)
        run: |
          mkdir -p android/keystore
          if [ ! -f android/keystore/fajr.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/keystore/fajr.keystore \
              -alias fajr -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass fajr2026 -keypass fajr2026 \
              -dname "CN=Iqaz Alfajr, OU=Fajr, O=FajrApp, L=Makkah, C=SA"
          fi

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: On failure, push build log to repo
        if: failure()
        run: |
          tail -c 20000 /tmp/gradle.log > build-error.log || echo "no log" > build-error.log
          git config user.name "arena-build-bot"
          git config user.email "bot@arena.ai"
          git add build-error.log
          git commit -m "ci: سجل فشل البناء [skip ci]" || true
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:${{ github.ref_name }}"

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Copy APK into public hosting folder
        run: |
          mkdir -p public/apk
          cp android/app/build/outputs/apk/release/app-release.apk public/apk/iqaz-alfajr.apk
          ls -la public/apk

      - name: Commit APK (and keystore on first run) back to the branch
        run: |
          git config user.name "arena-build-bot"
          git config user.email "bot@arena.ai"
          git add public/apk android/keystore
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "build: تحديث ملف APK [skip ci]"
          fi
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:${{ github.ref_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iqaz-alfajr-apk
          path: public/apk/iqaz-alfajr.apk
