name: "Build APK \U0001F4F1"

# يبني ملف APK حقيقي من التطبيق عند كل دفع، ويرفعه:
#  1) كـ Artifact للتحميل من صفحة الـ Actions
#  2) في GitHub Release بوسم apk-latest (رابط ثابت للتحميل)
#  3) داخل public/downloads ليُحمّل مباشرة من زر التحميل في الموقع

on:
  push:
    branches: [main, "arena/**"]
    paths-ignore:
      - "public/downloads/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35/36 packages
        run: |
          set -e
          # تنزيلات SDK تفشل أحياناً بشكل متقطع على شبكة GitHub Actions => إعادة محاولة
          retry() {
            n=1
            while [ "$n" -le 4 ]; do
              if "$@"; then return 0; fi
              echo "::warning::attempt $n failed, retrying in 20s: $*"
              n=$((n+1))
              sleep 20
            done
            echo "::error::all attempts failed: $*"
            return 1
          }

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
            mkdir -p "$SDK_ROOT"
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # لو تعثّر action الـ SDK ولم تتواجد أدوات الأوامر => نزّلها يدوياً
          if [ ! -x "$SDKMANAGER" ] && ! command -v sdkmanager > /dev/null 2>&1; then
            echo "::warning::sdkmanager missing - installing Android cmdline-tools manually"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            retry curl -fsSL --retry 3 -o /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            rm -rf /tmp/cmdline-tools && unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "SDKMANAGER=$SDKMANAGER"

          retry bash -c "yes | '$SDKMANAGER' --licenses > /dev/null 2>&1" || true
          retry "$SDKMANAGER" "platform-tools" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0"
          "$SDKMANAGER" --list_installed || true

      - name: Install dependencies
        run: npm ci

      - name: Test web alarm engine (lib/schedule.ts)
        run: npm run test:alarm

      - name: Build web export + sync Capacitor
        run: npm run build:apk

      - name: Bump Android versionCode from run number
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > /tmp/gradle.log 2>&1
          code=$?
          echo "Gradle exit code: $code"
          tail -n 60 /tmp/gradle.log
          if [ "$code" -ne 0 ]; then
            msg=$(grep -aE "FAILED|error:|Error|Exception|What went wrong" /tmp/gradle.log | tail -n 25 | tr '\n' '%0A' | cut -c1-4000)
            echo "::error::Gradle assembleDebug failed (exit $code): %0A$msg"
          fi
          cp /tmp/gradle.log "$GITHUB_WORKSPACE/gradle.log" || true
          exit $code

      - name: Test native alarm engine (JVM unit tests)
        continue-on-error: true
        run: |
          cd android
          set +e
          ./gradlew testDebugUnitTest --no-daemon --stacktrace > /tmp/unittest.log 2>&1
          code=$?
          tail -n 40 /tmp/unittest.log
          echo "unit tests exit code: $code"
          exit $code

      - name: Upload Gradle log (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect APK + generate apk-info.json
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/hatsally.apk
          node scripts/apk-info.mjs
          cat public/downloads/apk-info.json
          ls -lh public/downloads/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hatsally-apk
          path: public/downloads/hatsally.apk
          retention-days: 30

      - name: Publish GitHub Release (apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "هتصلي APK - أحدث نسخة 📱"
          body: |
            ## هتصلي يعني هتصلي - منبه الفجر الذكي 📱

            حمّل ملف **hatsally.apk** وثبّته على هاتفك الأندرويد مباشرة.

            ### طريقة التثبيت:
            1. حمّل الملف على هاتفك
            2. افتح الملف من التنزيلات
            3. اسمح بـ "التثبيت من مصادر غير معروفة" إذا طُلب منك
            4. اضغط تثبيت ثم افتح التطبيق 🕌

            > تم تصميم هذا البرنامج لإيقاظك لصلاة الفجر وجميع الصلوات فلا تنسانا من صالح دعائكم 🤍

            _بُني تلقائياً من `${{ github.ref_name }}` - run #${{ github.run_number }}_
          files: public/downloads/hatsally.apk

      - name: Commit APK back to branch (for in-site download button)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/hatsally.apk public/downloads/apk-info.json
          if git diff --staged --quiet; then
            echo "No APK changes to commit."
            exit 0
          fi
          git commit -m "📱 تحديث ملف APK (بناء تلقائي #${{ github.run_number }}) [skip ci]"
          git push
