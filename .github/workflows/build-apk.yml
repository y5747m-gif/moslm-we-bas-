name: Build Fajr Alarm APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.0.0). Empty = no GitHub Release, artifact only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/fajr-alarm.apk
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fajr-alarm-apk
          path: android/dist/fajr-alarm.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "منبه الفجر ${{ github.event.inputs.release_tag }}"
          body: |
            🌙 تطبيق منبه الفجر — لا يتوقف إلا بعد 3 صور لإثبات الاستيقاظ.

            - حمّل ملف `fajr-alarm.apk` وثبّته على هاتفك الأندرويد (8.0 فأحدث).
            - امنح الأذونات (الكاميرا + الإشعارات + المنبه الدقيق) من داخل التطبيق.
            - يعمل بدون إنترنت، والصور تبقى على جهازك فقط.
          files: android/dist/fajr-alarm.apk
