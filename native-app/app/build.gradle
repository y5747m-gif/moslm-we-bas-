plugins {
    id 'com.android.application'
}

// هتصلي - تطبيق أصلي حقيقي 🕌
// minSdk 21 (أندرويد 5.0) ليعمل على جميع الأجهزة الضعيفة والقوية
android {
    namespace 'com.hatsally.nativeapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.hatsally.nativeapp"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0-native"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // كشف الوجه والعينين على الجهاز (بدون إنترنت) - يعمل على الأجهزة الضعيفة
    implementation 'com.google.mlkit:face-detection:16.1.7'
}
